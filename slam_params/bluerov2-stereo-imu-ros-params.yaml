/bluerov2/ORB_SLAM3_IMU_STEREO_ROS2:
  ros__parameters:
    visualization: true
    do_loop_closing: true
    publish_map_points: true
    map_points_publish_frequency: 5000
    # Inertial input. The same messages also feed the place-recognition heading
    # check (Heading.* in bluerov2_stereo_imu.yaml): the stereo-imu node has no
    # separate heading_imu_topic.
    imu_topic_name: "/bluerov2/imu"
